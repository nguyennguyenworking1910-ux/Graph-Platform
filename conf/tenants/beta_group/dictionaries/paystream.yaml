  - name: ts
    dtype: BIGINT
    semantic_type: timestamp
    description: timestamp of tbl_merchant_payments
    maps_to: TRANSACTS.event_time
  - name: status
    dtype: VARCHAR
    semantic_type: status
    description: status of tbl_merchant_payments
    maps_to: TRANSACTS.status
  - name: voucher
    dtype: VARCHAR
    semantic_type: category
    description: category of tbl_merchant_payments
    maps_to: Item.key
- name: tbl_transfers
