source: paystream
domain: payment
tables:
- name: tbl_b2b_settlements
  description: tbl_b2b_settlements table of paystream
  primary_key:
  - txnId
  columns:
  - name: txnId
    dtype: VARCHAR
    semantic_type: id
    description: id of tbl_b2b_settlements
  - name: fromMerchant
    dtype: VARCHAR
    semantic_type: text
    description: text of tbl_b2b_settlements
    maps_to: Party.key
  - name: toMerchant
    dtype: VARCHAR
    semantic_type: text
    description: text of tbl_b2b_settlements
    maps_to: Party.key
  - name: amount
    dtype: DOUBLE
    semantic_type: amount
    description: amount of tbl_b2b_settlements
    maps_to: TRANSACTS.amount
  - name: ts
    dtype: BIGINT
    semantic_type: timestamp
    description: timestamp of tbl_b2b_settlements
    maps_to: TRANSACTS.event_time
- name: tbl_devices
  description: tbl_devices table of paystream
  columns:
  - name: userId
    dtype: VARCHAR
    semantic_type: foreign_key
    description: foreign key of tbl_devices, references tbl_users.userId
    references: tbl_users.userId
  - name: deviceId
    dtype: VARCHAR
    semantic_type: device_id
    description: device id of tbl_devices
    maps_to: Device.key
  - name: firstSeenTs
    dtype: BIGINT
    semantic_type: timestamp
    description: timestamp of tbl_devices, references tbl_users.signupTs
    references: tbl_users.signupTs
    maps_to: Device.time
- name: tbl_fraud_cases
  description: tbl_fraud_cases table of paystream
  primary_key:
  - caseId
  columns:
  - name: caseId
    dtype: VARCHAR
    semantic_type: id
    description: id of tbl_fraud_cases
    maps_to: Event.key
  - name: userId
    dtype: VARCHAR
    semantic_type: foreign_key
    description: foreign key of tbl_fraud_cases, references tbl_users.userId
    references: tbl_users.userId
  - name: caseType
    dtype: VARCHAR
    semantic_type: category
    description: category of tbl_fraud_cases
    maps_to: Event.status
  - name: reportedTs
    dtype: BIGINT
    semantic_type: timestamp
    description: timestamp of tbl_fraud_cases
    maps_to: Event.time
- name: tbl_merchant_payments
  description: tbl_merchant_payments table of paystream
