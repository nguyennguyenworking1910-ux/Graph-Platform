source: cinemax
domain: movies
tables:
- name: tbl_members
  description: tbl_members table of cinemax
  primary_key:
  - memberId
  columns:
  - name: memberId
    dtype: VARCHAR
    semantic_type: id
    description: id of tbl_members
    maps_to: Party.key
  - name: nickname
    dtype: VARCHAR
    semantic_type: name
    description: name of tbl_members
    pii: true
    maps_to: Party.full_name
  - name: phone
    dtype: VARCHAR
    semantic_type: phone
    description: phone of tbl_members
    pii: true
    maps_to: Identifier.key
  - name: email
    dtype: VARCHAR
    semantic_type: email
    description: email of tbl_members
    pii: true
    maps_to: Identifier.key
  - name: joined
    dtype: VARCHAR
    semantic_type: date
    description: date of tbl_members
    maps_to: Party.time
- name: tbl_tickets
  description: tbl_tickets table of cinemax
  primary_key:
  - ticketId
  columns:
  - name: ticketId
    dtype: VARCHAR
    semantic_type: id
    description: id of tbl_tickets
  - name: memberId
    dtype: VARCHAR
    semantic_type: foreign_key
    description: foreign key of tbl_tickets, references tbl_members.memberId
    references: tbl_members.memberId
  - name: movieCode
    dtype: VARCHAR
    semantic_type: category
    description: category of tbl_tickets
    maps_to: Item.key
  - name: movieTitle
    dtype: VARCHAR
    semantic_type: category
    description: category of tbl_tickets
    maps_to: Item.title
  - name: genre
    dtype: VARCHAR
    semantic_type: category
    description: category of tbl_tickets
    maps_to: Item.category
  - name: cinemaCode
    dtype: VARCHAR
    semantic_type: category
    description: category of tbl_tickets
    maps_to: Party.key
  - name: cinemaName
    dtype: VARCHAR
    semantic_type: name
    description: name of tbl_tickets
    pii: true
    maps_to: Party.trade_name
  - name: seats
    dtype: VARCHAR
    semantic_type: numeric
    description: numeric of tbl_tickets
    maps_to: PURCHASES.quantity
  - name: price
    dtype: VARCHAR
    semantic_type: amount
    description: amount of tbl_tickets
    maps_to: TRANSACTS.amount
  - name: purchasedAt
    dtype: VARCHAR
    semantic_type: timestamp
    description: timestamp of tbl_tickets
    maps_to: TRANSACTS.event_time
  - name: deviceId
    dtype: VARCHAR
    semantic_type: device_id
    description: device id of tbl_tickets
    maps_to: Device.key
