[project]
name = "graph-platform"
version = "0.1.0"
description = "Graph Platform: shared data/AI/ML hub for graph-network problems across all business domains"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic[bedrock]>=2.10.0",
    "duckdb>=1.1",
    "igraph>=1.0.0",
    "mlflow>=3.18.0",
    "neo4j>=6.4.1",
    "numpy>=2.0",
    "polars>=1.10",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.9",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "typer>=0.12",
]

[project.scripts]
gp = "graph_platform.cli:app"

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery-storage>=2.43.0",
    "sqlalchemy-bigquery>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_platform"]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "playwright>=1.65.2",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option defaults

[tool.ruff.lint.per-file-ignores]
"src/graph_platform/app.py" = ["E501"]  # interface copy and label tables
"src/graph_platform/ui/view.py" = ["E501"]  # legend and diagram markup
